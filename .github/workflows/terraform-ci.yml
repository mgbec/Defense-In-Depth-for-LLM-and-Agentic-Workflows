name: terraform-ci

on:
  pull_request:
    paths:
      - "terraform/**"
      - "tests/guardrail/**"
      - ".github/workflows/**"

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  static:
    name: fmt / validate / lint / scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive -diff terraform

      - name: Validate root and bootstrap
        run: |
          for dir in terraform terraform/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --chdir=terraform --init
          tflint --chdir=terraform --recursive --format compact

      # Initially non-blocking so the first run can be triaged. Remove soft_fail once the
      # baseline is clean so findings gate merges.
      - name: Checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          skip_path: terraform/bootstrap
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true

      - name: Upload SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif

  plan:
    name: plan (${{ matrix.env }})
    needs: static
    # Fork PRs get no OIDC token, so skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.env == 'prod' && vars.AWS_PLAN_ROLE_ARN_PROD || vars.AWS_PLAN_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: terraform
        run: terraform init -input=false -backend-config=envs/${{ matrix.env }}.backend.hcl

      - name: Plan
        id: plan
        working-directory: terraform
        run: |
          set +e
          terraform plan -input=false -lock-timeout=60s -no-color -detailed-exitcode \
            -var-file=envs/${{ matrix.env }}.tfvars \
            -var image_tag=${{ github.event.pull_request.head.sha }} -out=tfplan > plan.txt 2>&1
          code=$?
          cat plan.txt
          # exit code 2 means "changes present", which is expected.
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v9
        env:
          ENV_NAME: ${{ matrix.env }}
          OUTCOME: ${{ steps.plan.outcome }}
          HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENV_NAME;
            let plan = fs.existsSync('terraform/plan.txt') ? fs.readFileSync('terraform/plan.txt', 'utf8') : '(no output)';
            const limit = 60000;
            if (plan.length > limit) plan = plan.slice(0, limit) + '\n... truncated, see workflow logs ...';
            const marker = `<!-- tf-plan-${env} -->`;
            const status = process.env.OUTCOME === 'success'
              ? (process.env.HAS_CHANGES === 'true' ? 'changes detected' : 'no changes')
              : 'failed';
            const body = `${marker}\n### Terraform plan: \`${env}\` (${status})\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
