name: guardrail-tests

# Reusable: called after each deploy. Also runs weekly against prod to catch drift in
# managed model behavior, and can be triggered manually.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to test
        required: true
        default: prod
        type: choice
        options: [dev, prod]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  regression:
    name: regression (${{ inputs.environment || 'prod' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prod' }}
    env:
      ENVIRONMENT: ${{ inputs.environment || 'prod' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/guardrail/requirements.txt

      - run: pip install -r tests/guardrail/requirements.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run guardrail regression cases
        run: python tests/guardrail/run_cases.py --report guardrail-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-report-${{ env.ENVIRONMENT }}
          path: guardrail-report.json
          if-no-files-found: ignore

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.create({
              owner, repo,
              title: `Guardrail regression failed (${process.env.ENVIRONMENT}) - ${new Date().toISOString().slice(0, 10)}`,
              body: `Scheduled guardrail regression failed.\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              labels: ['security', 'guardrail']
            });
